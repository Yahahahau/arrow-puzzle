[build]
  publish = "."
  # stamps the commit id into index.html + version.json so running games (and iframes) auto-update
  command = "node tools/stamp-version.js"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
