<title>Arrow Puzzle</title>

<!-- runs before first paint: applies the saved theme so the wrong theme never flashes -->
<script>
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('arrow-puzzle.v1') || '{}'), r = document.documentElement;
    if (s.theme === 'dark' || s.theme === 'custom') r.setAttribute('data-theme', s.theme);
    var c = JSON.parse(localStorage.getItem('arrow-puzzle.custom') || 'null');
    if (c) for (var k in c) r.style.setProperty(k, c[k]);
    if (sessionStorage.getItem('arrow-puzzle.resume')) r.className += ' wipe-boot';   // reloaded onto a new version
  } catch (e) {}
})();
</script>
<!-- every asset url carries ?v=<app-version> so a new deploy never mixes with cached files -->
<script>
  window.AP_V = encodeURIComponent((document.querySelector('meta[name="app-version"]') || {}).content || 'dev');
  document.write('<link rel="stylesheet" href="css/themes.css?v=' + AP_V + '"><link rel="stylesheet" href="css/style.css?v=' + AP_V + '">');
</script>

      <button class="btn-secondary" data-action="home" data-sk="btn2"><svg class="ic bi" viewBox="0 0 24 24" aria-hidden="true"><path class="o fw" d="M3.4 11.6 L12.1 3.6 L20.7 11.4 L18.4 11.5 L18.6 20.3 L5.6 20.5 L5.7 11.7 Z"/><path class="o fy" d="M10 20.4 L10.1 15 L14.1 14.9 L14.2 20.3"/></svg><span data-i18n="home">Home</span></button>
    </div>
  </div>

  <div class="modal" id="m-confirm" hidden>
    <div class="card" data-sk="card" data-sk-amp="1.2">
      <h3 id="cf-title">Confirm</h3>
      <p id="cf-text"></p>
      <button class="btn-primary slim" data-action="confirm-yes" data-sk="btn"><svg class="ic bi" viewBox="0 0 24 24" aria-hidden="true"><path class="o n" d="M4.4 12.6 L9.6 17.6 L19.8 6.2" stroke-width="3.4"/></svg><span data-i18n="confirm">Confirm</span></button>
      <button class="btn-secondary" data-action="confirm-no" data-sk="btn2"><svg class="ic bi" viewBox="0 0 24 24" aria-hidden="true"><path class="o n" d="M6 6.3 L18.2 17.8 M17.8 5.8 L6.2 18.1" stroke-width="3.2"/></svg><span data-i18n="cancel">Cancel</span></button>
    </div>
  </div>

  <!-- confetti sits above everything (including modals) and never blocks input -->
  <canvas id="confetti" aria-hidden="true"></canvas>
</div>

</script>
