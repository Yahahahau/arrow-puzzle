<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f9fafc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Arrow Puzzle</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-screen="home">

  <!-- ================= HOME ================= -->
  <section class="screen" id="s-home" aria-label="หน้าหลัก">
    <div class="bg-shapes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="home-body">
      <div class="daily-card" id="daily-card">
        <svg class="cal-ico" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="gcal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc83d"/><stop offset="1" stop-color="#ff9d12"/></linearGradient></defs>
          <rect x="4" y="6" width="56" height="54" rx="12" fill="url(#gcal)"/>
          <rect x="10" y="14" width="44" height="40" rx="9" fill="#f6f1ea"/>
          <rect x="17" y="2" width="5" height="12" rx="2.5" fill="#f6f1ea" stroke="#f0a020" stroke-width="1.5"/>
          <rect x="42" y="2" width="5" height="12" rx="2.5" fill="#f6f1ea" stroke="#f0a020" stroke-width="1.5"/>
          <circle cx="32" cy="35" r="13" fill="none" stroke="#d6cfc6" stroke-width="3.5"/>
          <path d="M32 27l2.6 5.4 5.9.8-4.3 4.1 1 5.9L32 40.4l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="#d6cfc6"/>
        </svg>
        <div class="daily-lbl">คำท้าทายประจำวัน</div>
        <div class="daily-date" id="daily-date">–</div>
        <button class="pill-sm" id="btn-daily" data-action="play-daily">เล่น</button>
      </div>
      <h1 class="game-title">Arrow Puzzle</h1>
      <div class="home-btns">
        <button class="btn-primary" data-action="continue">
          <span class="b1">เล่นเกมต่อไป</span>
          <span class="b2" id="home-level">เลเวล 1</span>
        </button>
        <button class="btn-secondary" data-action="restart-game">รีสตาร์ทเกม</button>
      </div>
    </div>
  </section>

  <!-- ================= CHALLENGE ================= -->
  <section class="screen" id="s-challenge" aria-label="คำท้า">
    <div class="page-head"><h2>คำท้า</h2></div>
    <div class="scroll">
      <div class="col">
        <div class="month-bar">
          <button class="round-btn" data-action="month-prev" aria-label="เดือนก่อนหน้า">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="month-title" id="month-title">–</div>
          <button class="round-btn" data-action="month-next" id="btn-month-next" aria-label="เดือนถัดไป">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="cal-week" id="cal-week"></div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-note" id="cal-note"></div>
      </div>
    </div>
  </section>

  <!-- ================= PROFILE ================= -->
  <section class="screen" id="s-profile" aria-label="ฉัน">
    <div class="page-head"><h2>ฉัน</h2></div>
    <div class="scroll">
      <div class="col">
        <div class="avatar">
          <svg viewBox="0 0 48 48"><circle cx="24" cy="18" r="9" fill="#fff"/><path d="M6 44c0-10 8-16 18-16s18 6 18 16z" fill="#fff"/></svg>
        </div>
        <div class="stats">
          <div class="stat"><b id="st-level">1</b><span>เลเวลปัจจุบัน</span></div>
          <div class="stat"><b id="st-solved">0</b><span>ด่านที่ผ่าน</span></div>
          <div class="stat"><b id="st-daily">0</b><span>คำท้าที่ผ่าน</span></div>
        </div>
        <div class="card-list">
          <div class="row"><span>เสียง</span><button class="switch" data-action="toggle-sound" id="sw-sound-p" role="switch" aria-checked="true"><i></i></button></div>
          <div class="row"><span>การสั่น</span><button class="switch" data-action="toggle-vibrate" id="sw-vib-p" role="switch" aria-checked="true"><i></i></button></div>
        </div>
        <button class="btn-secondary danger" data-action="reset-progress">ล้างความคืบหน้าทั้งหมด</button>
      </div>
    </div>
  </section>

  <!-- ================= GAME ================= -->
  <section class="screen" id="s-game" aria-label="เกม">
    <div class="panel">
      <header class="topbar col">
        <button class="icon-btn" data-action="home" aria-label="กลับ">
          <svg viewBox="0 0 24 24"><path d="M15 4.5L7.5 12 15 19.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 id="g-title">เลเวล 1</h2>
        <button class="icon-btn" data-action="pause" aria-label="ตั้งค่า">
          <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M10.3 2.9h3.4l.55 2.4 1.9.8 2.1-1.3 2.4 2.4-1.3 2.1.8 1.9 2.4.55v3.4l-2.4.55-.8 1.9 1.3 2.1-2.4 2.4-2.1-1.3-1.9.8-.55 2.4h-3.4l-.55-2.4-1.9-.8-2.1 1.3-2.4-2.4 1.3-2.1-.8-1.9-2.4-.55v-3.4l2.4-.55.8-1.9-1.3-2.1 2.4-2.4 2.1 1.3 1.9-.8z"/><circle cx="12" cy="12" r="3.3" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>
        </button>
      </header>
      <div class="stats-row col">
        <div class="chip chip-count">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5L3.2 10.2c-.7.3-.7 1.3 0 1.5l6.2 2.2 2.2 6.2c.3.7 1.2.7 1.5 0L20.5 3.5z" fill="#5b667c"/></svg>
          <span id="g-count">0</span>
        </div>
        <div class="hearts" id="g-hearts" aria-label="หัวใจ">
          <svg class="heart" viewBox="0 0 32 30"><use href="#ic-heart"/></svg>
          <svg class="heart" viewBox="0 0 32 30"><use href="#ic-heart"/></svg>
          <svg class="heart" viewBox="0 0 32 30"><use href="#ic-heart"/></svg>
        </div>
        <div class="chip chip-diff" id="g-diff">ง่าย</div>
      </div>
      <div id="stage">
        <canvas id="board" aria-label="กระดานเกม"></canvas>
        <div id="dev" hidden>
          <pre id="dev-out">dev</pre>
          <div class="dev-btns">
            <button data-action="dev-grid" id="dv-grid">grid</button>
            <button data-action="dev-perf" id="dv-perf">perf</button>
            <button data-action="dev-off">&times;</button>
          </div>
        </div>
        <button class="fit-btn" id="btn-fit" data-action="fit" aria-label="ย่อให้พอดี">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <footer class="tools">
        <button class="tool" data-action="hint" id="btn-hint" aria-label="คำใบ้">
          <svg viewBox="0 0 48 56" aria-hidden="true">
            <defs><radialGradient id="gbulb" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#ffe46b"/><stop offset=".6" stop-color="#ffbe16"/><stop offset="1" stop-color="#f09a00"/></radialGradient></defs>
            <path d="M24 4C14.6 4 8 10.8 8 19.2c0 5.2 2.4 8.8 5.2 11.8 1.6 1.7 2.4 3.4 2.4 5.4V38h16.8v-1.6c0-2 .8-3.7 2.4-5.4 2.8-3 5.2-6.6 5.2-11.8C40 10.8 33.4 4 24 4z" fill="url(#gbulb)"/>
            <ellipse cx="17" cy="14" rx="4" ry="6" fill="#fff" opacity=".45" transform="rotate(22 17 14)"/>
            <rect x="15" y="39" width="18" height="4.6" rx="2.3" fill="#c9d3e2"/>
            <rect x="16.5" y="44.4" width="15" height="4.4" rx="2.2" fill="#aab6ca"/>
            <rect x="19" y="49.4" width="10" height="4" rx="2" fill="#8f9db5"/>
          </svg>
          <span class="badge" id="b-hint">3</span>
        </button>
        <button class="tool" data-action="ruler" id="btn-ruler" aria-label="ไม้บรรทัด">
          <svg viewBox="0 0 48 56" aria-hidden="true">
            <defs><linearGradient id="grul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f86ff"/><stop offset="1" stop-color="#5546e6"/></linearGradient></defs>
            <g transform="rotate(35 24 28)">
              <rect x="14" y="2" width="20" height="52" rx="4" fill="url(#grul)"/>
              <g stroke="#e9e6ff" stroke-width="2" stroke-linecap="round" opacity=".9">
                <path d="M14 10h6M14 18h4M14 26h6M14 34h4M14 42h6"/>
              </g>
              <rect x="25" y="8" width="3.4" height="30" rx="1.7" fill="#fff" opacity=".35"/>
              <circle cx="24" cy="47" r="2.4" fill="#fff"/>
            </g>
          </svg>
          <span class="badge" id="b-ruler">3</span>
        </button>
      </footer>
    </div>
    <div class="strip" aria-hidden="true"></div>
  </section>

  <!-- ================= TAB BAR ================= -->
  <nav id="tabbar" aria-label="เมนู">
    <button class="tab" data-tab="home" data-action="tab">
      <svg viewBox="0 0 32 32"><path d="M16 3.5L3 15.2c-.7.6-.3 1.8.7 1.8H6v10c0 .8.7 1.5 1.5 1.5H12v-8h8v8h4.5c.8 0 1.5-.7 1.5-1.5V17h2.3c1 0 1.4-1.2.7-1.8z" fill="currentColor"/></svg>
      <span>หน้าหลัก</span>
    </button>
    <button class="tab" data-tab="challenge" data-action="tab">
      <svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="24" rx="6" fill="currentColor"/><rect x="9" y="2" width="3" height="7" rx="1.5" fill="currentColor"/><rect x="20" y="2" width="3" height="7" rx="1.5" fill="currentColor"/><circle cx="16" cy="18.5" r="7" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 14.2l1.3 2.7 3 .4-2.2 2.1.5 3-2.6-1.4-2.6 1.4.5-3-2.2-2.1 3-.4z" fill="#fff"/></svg>
      <span>คำท้า</span>
    </button>
    <button class="tab" data-tab="profile" data-action="tab">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="currentColor"/><circle cx="16" cy="12.5" r="4.8" fill="#fff"/><path d="M6.6 25.2c1.6-4 5.3-6.2 9.4-6.2s7.8 2.2 9.4 6.2c-2.5 2.6-5.8 4-9.4 4s-6.9-1.4-9.4-4z" fill="#fff"/></svg>
      <span>ฉัน</span>
    </button>
  </nav>

  <!-- animation layer: covers the whole app so flying arrows are never clipped by the board -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- ================= MODALS ================= -->
  <div class="modal" id="m-pause" hidden>
    <div class="card">
      <h3>ตั้งค่า</h3>
      <div class="row"><span>เสียง</span><button class="switch" data-action="toggle-sound" id="sw-sound" role="switch" aria-checked="true"><i></i></button></div>
      <div class="row"><span>การสั่น</span><button class="switch" data-action="toggle-vibrate" id="sw-vib" role="switch" aria-checked="true"><i></i></button></div>
      <button class="btn-primary slim" data-action="resume">เล่นต่อ</button>
      <button class="btn-secondary" data-action="restart-level">เริ่มด่านใหม่</button>
      <button class="btn-secondary" data-action="home">กลับหน้าหลัก</button>
    </div>
  </div>

  <div class="modal" id="m-win" hidden>
    <div class="card center">
      <div class="medal" aria-hidden="true">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#ffc83d"/><circle cx="32" cy="32" r="22" fill="#ffb000"/><path d="M32 16l4.8 10 11 1.5-8 7.6 2 10.9L32 40.8l-9.8 5.2 2-10.9-8-7.6 11-1.5z" fill="#fff"/></svg>
      </div>
      <h3 id="win-title">ผ่านด่าน!</h3>
      <p id="win-sub"></p>
      <button class="btn-primary slim" data-action="next" id="btn-next">ด่านถัดไป</button>
      <button class="btn-secondary" data-action="restart-level">เล่นซ้ำ</button>
    </div>
  </div>

  <div class="modal" id="m-lose" hidden>
    <div class="card center">
      <svg class="heart big" viewBox="0 0 32 30"><use href="#ic-heart-off"/></svg>
      <h3>หัวใจหมดแล้ว</h3>
      <p>ลองดูอีกครั้ง ใช้คำใบ้ช่วยได้นะ</p>
      <button class="btn-primary slim" data-action="restart-level">เล่นใหม่</button>
      <button class="btn-secondary" data-action="home">กลับหน้าหลัก</button>
    </div>
  </div>

  <div class="modal" id="m-confirm" hidden>
    <div class="card center">
      <h3 id="cf-title">ยืนยัน</h3>
      <p id="cf-text"></p>
      <button class="btn-primary slim" data-action="confirm-yes">ยืนยัน</button>
      <button class="btn-secondary" data-action="confirm-no">ยกเลิก</button>
    </div>
  </div>

  <!-- shared SVG symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gheart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6666"/><stop offset="1" stop-color="#f02c2c"/></linearGradient>
      <symbol id="ic-heart" viewBox="0 0 32 30">
        <path d="M16 28.2C7 21.8 1.6 16.9 1.6 10.4 1.6 5.6 5.2 2 9.8 2c2.6 0 4.9 1.2 6.2 3.2C17.3 3.2 19.6 2 22.2 2c4.6 0 8.2 3.6 8.2 8.4 0 6.5-5.4 11.4-14.4 17.8z" fill="url(#gheart)"/>
        <path d="M8.2 7.2c-2 .6-3.3 2.4-3.3 4.6" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="ic-heart-off" viewBox="0 0 32 30">
        <path d="M16 28.2C7 21.8 1.6 16.9 1.6 10.4 1.6 5.6 5.2 2 9.8 2c2.6 0 4.9 1.2 6.2 3.2C17.3 3.2 19.6 2 22.2 2c4.6 0 8.2 3.6 8.2 8.4 0 6.5-5.4 11.4-14.4 17.8z" fill="#dfe4ee"/>
      </symbol>
    </defs>
  </svg>
</div>

<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/view.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
